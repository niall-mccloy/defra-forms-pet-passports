pages:
  - id: 3d4e5f60-7182-4394-a5b6-c7d8e9f01234
    title: EU pet passports
    path: /start
    controller: StartPageController
    components:
      - name: introduction
        title: Introduction
        type: Html
        content: |
          <p class="govuk-body">From [Date], anyone in England, Scotland and Wales must have an EU pet passport to take a cat, dog or ferret to an <a class="govuk-link" href="https://www.gov.uk/eu-eea">EU country</a>.</p>
          <p class="govuk-body">You can only get an EU pet passport from an <a class="govuk-link" href="https://www.gov.uk/government/collections/official-veterinarians-ovs-and-ov-practices-forms-and-guidance">Official Veterinarian (OV)</a>.</p>
          <div class="govuk-inset-text">There are different rules if you're travelling to <a class="govuk-link" href="https://www.gov.uk/taking-your-pet-abroad/travelling-to-northern-ireland">Northern Ireland</a> or a <a class="govuk-link" href="https://www.gov.uk/taking-your-pet-abroad/travelling-to-a-non-eu-country">non-EU country</a>.</div>

          <h2 class="govuk-heading-m">Guidance for pet owners</h2>
          <p class="govuk-body">You must have a valid EU pet passport before taking your pet dog, cat or ferret to an EU country. An Official Veterinarian (OV) can issue a passport before you travel.</p>
          <p class="govuk-body"><a class="govuk-link" href="https://www.gov.uk/taking-your-pet-abroad">Taking your pet dog, cat or ferret abroad</a></p>

          <h2 class="govuk-heading-m">Guidance for Official Veterinarians (OVs) and veterinary practices</h2>
          <p class="govuk-body">Veterinary practices are responsible for ordering and issuing pet passports to pet owners.</p>
          <p class="govuk-body">Records of any pet passports issued must be kept for 3 years.</p>

          <h3 class="govuk-heading-s">Order pet passports</h3>
          <p class="govuk-body">Vet practices can order passports in packs of 20. Find out how to:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li><a class="govuk-link" href="/order-pet-passports/start">order pet passports</a></li>
            <li>view your order history</li>
          </ul>

          <h3 class="govuk-heading-s">Help us plan for demand for EU pet passports</h3>
          <p class="govuk-body"><a class="govuk-link" href="/pet-passports-forecasting/start">Tell us how many animal health certificates you issued in the last year</a>, to help us plan for new EU pet passports.</p>

          <h3 class="govuk-heading-s">Report a damaged, destroyed, lost or incorrectly completed pet passport</h3>
          <p class="govuk-body"><a class="govuk-link" href="/report-pet-passport-damage/start">Report a damaged, destroyed, lost or incorrectly completed pet passport</a> to keep passport records accurate and up to date.</p>

          <h3 class="govuk-heading-s">Register a pet passport to a pet</h3>
          <p class="govuk-body">Register a pet passport to the microchip number of a cat, dog or ferret. You can also manage pet passport records to see passports that have been registered.</p>

